<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Red Cloud ICT Solutions">
  <!-- Cloud shape -->
  <g transform="translate(4, 8)">
    <!-- Main cloud body -->
    <ellipse cx="28" cy="34" rx="22" ry="14" fill="#E30613"/>
    <circle cx="16" cy="30" r="11" fill="#E30613"/>
    <circle cx="30" cy="24" r="14" fill="#E30613"/>
    <circle cx="42" cy="30" r="10" fill="#E30613"/>
    <!-- Cloud highlight -->
    <ellipse cx="26" cy="22" rx="8" ry="5" fill="#ff4d57" opacity="0.4"/>
  </g>
  <!-- RED text -->
  <text x="60" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="20" fill="#E30613" letter-spacing="1">RED</text>
  <!-- Cloud text -->
  <text x="60" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" fill="#3A3A3A">Cloud</text>
  <!-- ICT Solutions subtitle -->
  <text x="60" y="58" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="8.5" fill="#888888" letter-spacing="0.5">ICT Solutions</text>
</svg>
