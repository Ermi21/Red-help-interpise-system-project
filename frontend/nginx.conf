server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ── WebSocket / SSE — must come BEFORE the generic /api/ block ─────────────
    # WebSocket upgrade for real-time event stream
    location /api/v1/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout so idle sockets don't get cut
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # No buffering — WebSocket frames must flow immediately
        proxy_buffering off;
    }

    # SSE fallback stream (also needs no buffering)
    location /api/v1/notifications/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Required for SSE — no buffering, flush immediately
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";
    }

    # ── General API proxy ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for slow AI/LLM and DB queries
        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;

        # Buffer tuning — avoids micro-stalls on large JSON responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    # All non-API routes go to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error fallback
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
