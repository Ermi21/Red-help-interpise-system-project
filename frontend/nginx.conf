server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for slow AI/LLM and DB queries
        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;

        # Buffer tuning — avoids micro-stalls on large JSON responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # SPA routing for /Redcloud/
    location /Redcloud/ {
        try_files $uri $uri/ /Redcloud/index.html;
    }

    # Redirect root / to /Redcloud/
    location = / {
        return 301 /Redcloud/;
    }

    # Fallback for any other route to Redcloud index
    location / {
        try_files $uri $uri/ /Redcloud/index.html;
    }

    # Error fallback
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
